<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역화 전략 Quiz - 교사용 실시간 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style>
    * { font-family: 'Pretendard', sans-serif; }
    .fade-in { animation: fadeIn 0.25s ease-in-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Top Header -->
    <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md">
          <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900">교사용 실시간 성적 대시보드</h1>
          <p class="text-xs text-slate-500">학급별 성적 관리 및 문제별 정·오답 분석</p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="fetchLiveData()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md flex items-center gap-2">
          <i class="fa-solid fa-arrows-rotate" id="refreshIcon"></i>
          <span>새로고침</span>
        </button>
        <button onclick="exportToCSV()" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md flex items-center gap-2">
          <i class="fa-solid fa-file-excel"></i>
          <span>엑셀 다운로드</span>
        </button>
      </div>
    </div>

    <!-- 반 선택 탭 Bar -->
    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex items-center space-x-2 overflow-x-auto" id="classTabContainer">
      <!-- 동적 생성 (전체, 1반~13반) -->
    </div>

    <!-- 학급별 요약 통계 Card -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">총 제출 학생</span>
          <span id="statTotalStudents" class="text-2xl font-black text-indigo-600">0명</span>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-users"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-slate-400 block mb-1">전체 평균 점수</span>
          <span id="statAvgScore" class="text-2xl font-black text-emerald-600">0점</span>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
          <i class="fa-solid fa-chart-line"></i>
        </div>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div class="space-y-1">
          <span class="text-xs font-bold text-slate-400 block">최고 점수 & 학생</span>
          <div class="flex items-baseline space-x-2">
            <span id="statMaxScore" class="text-2xl font-black text-amber-500">0점</span>
          </div>
          <p id="statMaxScorers" class="text-xs font-extrabold text-slate-600 truncate max-w-[180px]">최고점자: -</p>
        </div>
        <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-xl shrink-0">
          <i class="fa-solid fa-trophy"></i>
        </div>
      </div>
    </div>

    <!-- Student Table Card -->
    <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden">
      <div class="p-4 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div class="flex items-center space-x-3 w-full sm:w-auto">
          <h3 class="font-extrabold text-slate-900 text-base" id="tableHeaderTitle">전체 제출 목록</h3>
          <!-- 반별 초기화 버튼 (특정 반 클릭 시 노출) -->
          <button id="resetClassBtn" onclick="resetCurrentClassData()" class="hidden px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs rounded-xl border border-rose-200 transition-all flex items-center space-x-1">
            <i class="fa-solid fa-trash-can"></i>
            <span id="resetBtnLabel">1반 기록 초기화</span>
          </button>
        </div>

        <input type="text" id="searchInput" oninput="filterAndRenderTable()" placeholder="소속 또는 이름 검색..." class="px-3.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-indigo-500 w-full sm:w-64">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-400 text-xs uppercase font-extrabold border-b border-slate-100">
              <th class="p-4 pl-6">소속 (반/번호)</th>
              <th class="p-4">이름</th>
              <th class="p-4">최종 점수</th>
              <th class="p-4">제출 일시</th>
              <th class="p-4 text-center">상세 답안</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm font-medium">
            <tr>
              <td colspan="5" class="p-8 text-center text-slate-400 text-xs">
                데이터를 불러오는 중입니다...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- 문항별 상세 답안 보기 팝업 Modal -->
  <div id="modalDetail" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-4 fade-in relative max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <span id="modalStudentClass" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-md border border-indigo-100">1반 5번</span>
          <h3 id="modalStudentName" class="text-xl font-extrabold text-slate-900 mt-1">홍길동 학생 상세 답안</h3>
        </div>
        <button onclick="closeDetailModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-sm transition-all">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div id="modalDetailContent" class="space-y-3 overflow-y-auto pr-1 flex-1 py-1">
        <!-- 5개 문항 Card 동적 생성 -->
      </div>

      <div class="pt-3 border-t border-slate-100 flex justify-end">
        <button onclick="closeDetailModal()" class="px-5 py-2.5 bg-slate-800 text-white font-bold text-xs rounded-xl hover:bg-slate-900 transition-all">
          닫기
        </button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYADtUhL9w1tz8mFqWjfdouv8tuEkYx6Dv5KxSyc03H2OCNK3JTkY-FTlnAr5VXon5/exec';

    let globalStudentData = [];
    let activeTabClass = 'all'; // 'all' 또는 '1반', '2반' ...

    function renderTabs() {
      const tabContainer = document.getElementById('classTabContainer');
      tabContainer.innerHTML = '';

      const tabs = ['all'];
      for (let i = 1; i <= 13; i++) tabs.push(`${i}반`);

      tabs.forEach(tab => {
        const btn = document.createElement('button');
        const isActive = activeTabClass === tab;
        const labelText = tab === 'all' ? '전체 보기' : tab;

        btn.className = isActive
          ? "px-4 py-2 rounded-xl text-xs font-extrabold transition-all bg-indigo-600 text-white shadow-md shrink-0"
          : "px-4 py-2 rounded-xl text-xs font-bold transition-all bg-slate-50 hover:bg-slate-100 text-slate-600 border border-slate-200 shrink-0";

        btn.innerText = labelText;
        btn.onclick = () => {
          activeTabClass = tab;
          renderTabs();
          filterAndRenderTable();
        };

        tabContainer.appendChild(btn);
      });
    }

    async function fetchLiveData() {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('fa-spin');

      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        globalStudentData = data;
        filterAndRenderTable();
      } catch (err) {
        console.error(err);
      } finally {
        if (refreshIcon) refreshIcon.classList.remove('fa-spin');
      }
    }

    function filterAndRenderTable() {
      const tbody = document.getElementById('studentTableBody');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const resetBtn = document.getElementById('resetClassBtn');
      const resetBtnLabel = document.getElementById('resetBtnLabel');
      const tableTitle = document.getElementById('tableHeaderTitle');

      tbody.innerHTML = '';

      // 1. 반 필터링
      let currentData = globalStudentData;
      if (activeTabClass !== 'all') {
        currentData = globalStudentData.filter(r => r.studentId.indexOf(activeTabClass) === 0);
        resetBtn.classList.remove('hidden');
        resetBtnLabel.innerText = `${activeTabClass} 기록 초기화`;
        tableTitle.innerText = `${activeTabClass} 제출 목록`;
      } else {
        resetBtn.classList.add('hidden');
        tableTitle.innerText = `전체 제출 목록`;
      }

      // 2. 검색어 필터링
      const filtered = currentData.filter(r => 
        r.studentId.toString().toLowerCase().includes(searchVal) || 
        r.studentName.toLowerCase().includes(searchVal)
      );

      // 통계 계산
      document.getElementById('statTotalStudents').innerText = `${currentData.length}명`;
      
      if (currentData.length > 0) {
        const total = currentData.reduce((acc, cur) => acc + Number(cur.score || 0), 0);
        const avg = (total / currentData.length).toFixed(1);
        const maxScore = Math.max(...currentData.map(r => Number(r.score || 0)));
        
        // 최고 점수 학생 추출
        const topScorers = currentData.filter(r => Number(r.score || 0) === maxScore);
        const topScorerNames = topScorers.map(r => `${r.studentId.split(' ')[1] || ''} ${r.studentName}`).join(', ');

        document.getElementById('statAvgScore').innerText = `${avg}점`;
        document.getElementById('statMaxScore').innerText = `${maxScore}점`;
        document.getElementById('statMaxScorers').innerText = `최고점자: ${topScorerNames}`;
      } else {
        document.getElementById('statAvgScore').innerText = '0점';
        document.getElementById('statMaxScore').innerText = '0점';
        document.getElementById('statMaxScorers').innerText = '최고점자: -';
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="p-8 text-center text-slate-400 text-xs">
              제출된 학생 성적 기록이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      // 최신 제출순으로 정렬
      [...filtered].reverse().forEach((r, idx) => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/80 transition-colors";
        
        const hasDetails = r.details && Array.isArray(r.details) && r.details.length > 0;

        tr.innerHTML = `
          <td class="p-4 pl-6 font-bold text-indigo-600">${r.studentId}</td>
          <td class="p-4 font-bold text-slate-800">${r.studentName}</td>
          <td class="p-4 font-black text-amber-600 text-base">${r.score}점</td>
          <td class="p-4 text-xs text-slate-400">${r.date}</td>
          <td class="p-4 text-center">
            ${hasDetails ? `
              <button onclick='openDetailModal(${JSON.stringify(r)})' class="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-extrabold text-xs rounded-lg border border-indigo-200 transition-all">
                🔍 상세 답안
              </button>
            ` : `<span class="text-xs text-slate-300">-</span>`}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 선택한 반 기록 초기화 (삭제)
    async function resetCurrentClassData() {
      if (activeTabClass === 'all') return;

      if (confirm(`정말로 ${activeTabClass}의 제출 성적 데이터를 모두 삭제하시겠습니까?`)) {
        try {
          const res = await fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              action: 'resetClass',
              className: activeTabClass
            })
          });
          
          alert(`${activeTabClass} 데이터가 정상적으로 초기화되었습니다.`);
          fetchLiveData(); // 데이터 다시 로드
        } catch (err) {
          console.error(err);
          alert('초기화 중 오류가 발생했습니다.');
        }
      }
    }

    // 문항별 상세 답안 팝업창 모달 열기
    function openDetailModal(studentData) {
      document.getElementById('modalStudentClass').innerText = studentData.studentId;
      document.getElementById('modalStudentName').innerText = `${studentData.studentName} 학생 상세 결과 (${studentData.score}점)`;

      const container = document.getElementById('modalDetailContent');
      container.innerHTML = '';

      studentData.details.forEach(item => {
        const card = document.createElement('div');
        const isCorrect = item.isCorrect;

        card.className = isCorrect 
          ? "p-3.5 rounded-2xl bg-emerald-50/60 border border-emerald-200 space-y-1.5 text-xs"
          : "p-3.5 rounded-2xl bg-red-50/60 border border-red-200 space-y-1.5 text-xs";

        card.innerHTML = `
          <div class="flex items-center justify-between font-bold">
            <span class="text-slate-800">Q${item.num}. ${item.question}</span>
            <span class="${isCorrect ? 'text-emerald-700 bg-emerald-100' : 'text-red-700 bg-red-100'} px-2 py-0.5 rounded-md font-extrabold shrink-0 ml-2">
              ${isCorrect ? '⭕ 정답' : '❌ 오답'}
            </span>
          </div>
          <div class="text-slate-600 flex items-center gap-3 pt-1 border-t border-slate-200/50">
            <span>선택한 답: <strong class="${isCorrect ? 'text-emerald-800' : 'text-red-800'}">${item.userOpt}</strong></span>
            ${!isCorrect ? `<span class="text-slate-500">정답: <strong class="text-slate-800">${item.correctAns}</strong></span>` : ''}
          </div>
        `;

        container.appendChild(card);
      });

      document.getElementById('modalDetail').classList.remove('hidden');
    }

    function closeDetailModal() {
      document.getElementById('modalDetail').classList.add('hidden');
    }

    function exportToCSV() {
      if (globalStudentData.length === 0) return alert('다운로드할 데이터가 없습니다.');

      let currentData = globalStudentData;
      if (activeTabClass !== 'all') {
        currentData = globalStudentData.filter(r => r.studentId.indexOf(activeTabClass) === 0);
      }

      let csvContent = "\uFEFF소속,이름,최종점수,제출일시\n";
      currentData.forEach(r => {
        csvContent += `"${r.studentId}","${r.studentName}",${r.score},"${r.date}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `지역화전략_퀴즈성적_${activeTabClass}_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    window.onload = () => {
      renderTabs();
      fetchLiveData();
      setInterval(fetchLiveData, 15000); // 15초 자동 새로고침
    };
  </script>
</body>
</html>
