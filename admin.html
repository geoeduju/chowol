<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지역화 전략 Quiz - 선생님용 성적 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
  <style> * { font-family: 'Pretendard', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 sm:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Top Bar -->
    <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <div>
          <h1 class="text-xl font-extrabold text-slate-900">학생 성적 제출 관리자</h1>
          <p class="text-xs text-slate-500">제출된 학번별 최종 점수 리포트 및 엑셀 다운로드</p>
        </div>
      </div>

      <div class="flex items-center gap-2 w-full sm:w-auto">
        <button onclick="exportToCSV()" class="flex-1 sm:flex-none px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-excel"></i>
          <span>엑셀(CSV) 다운로드</span>
        </button>
        <button onclick="clearAllData()" class="px-3 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs sm:text-sm rounded-xl transition-all border border-rose-200 flex items-center gap-1.5">
          <i class="fa-solid fa-trash-can"></i>
          <span>초기화</span>
        </button>
      </div>
    </div>

    <!-- Search & Summary Stats Bar -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-slate-400 block">총 응시 학생</span>
          <span id="statTotalStudents" class="text-2xl font-black text-indigo-600">0명</span>
        </div>
        <i class="fa-solid fa-users text-indigo-200 text-3xl"></i>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-slate-400 block">전체 평균 점수</span>
          <span id="statAvgScore" class="text-2xl font-black text-emerald-600">0점</span>
        </div>
        <i class="fa-solid fa-chart-line text-emerald-200 text-3xl"></i>
      </div>

      <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
        <div>
          <span class="text-xs font-bold text-slate-400 block">최고 점수</span>
          <span id="statMaxScore" class="text-2xl font-black text-amber-500">0점</span>
        </div>
        <i class="fa-solid fa-trophy text-amber-200 text-3xl"></i>
      </div>
    </div>

    <!-- Student Table Card -->
    <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden">
      <div class="p-4 sm:p-6 border-b border-slate-100 flex items-center justify-between">
        <h3 class="font-extrabold text-slate-900 text-base">제출 완료 목록</h3>
        <input type="text" id="searchInput" oninput="renderTable()" placeholder="학번 또는 이름 검색..." class="px-3.5 py-1.5 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-indigo-500 w-44 sm:w-64">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-400 text-xs uppercase font-extrabold border-b border-slate-100">
              <th class="p-4 pl-6">학번</th>
              <th class="p-4">이름</th>
              <th class="p-4">최종 점수</th>
              <th class="p-4">제출 일시</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y divide-slate-100 text-sm font-medium">
            <!-- Table rows populated by JS -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    function loadResults() {
      return JSON.parse(localStorage.getItem('quiz_student_results') || '[]');
    }

    function renderTable() {
      const records = loadResults();
      const tbody = document.getElementById('studentTableBody');
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

      tbody.innerHTML = '';

      const filtered = records.filter(r => 
        r.studentId.toString().toLowerCase().includes(searchVal) || 
        r.studentName.toLowerCase().includes(searchVal)
      );

      // 통계 계산
      document.getElementById('statTotalStudents').innerText = `${records.length}명`;
      if (records.length > 0) {
        const total = records.reduce((acc, cur) => acc + cur.score, 0);
        const avg = (total / records.length).toFixed(1);
        const max = Math.max(...records.map(r => r.score));

        document.getElementById('statAvgScore').innerText = `${avg}점`;
        document.getElementById('statMaxScore').innerText = `${max}점`;
      } else {
        document.getElementById('statAvgScore').innerText = '0점';
        document.getElementById('statMaxScore').innerText = '0점';
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="p-8 text-center text-slate-400 text-xs">
              제출된 학생 성적 기록이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      filtered.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50/80 transition-colors";
        tr.innerHTML = `
          <td class="p-4 pl-6 font-bold text-indigo-600">${r.studentId}</td>
          <td class="p-4 font-bold text-slate-800">${r.studentName}</td>
          <td class="p-4 font-black text-amber-600 text-base">${r.score}점</td>
          <td class="p-4 text-xs text-slate-400">${r.date}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportToCSV() {
      const records = loadResults();
      if (records.length === 0) return alert('다운로드할 성적 데이터가 없습니다.');

      let csvContent = "\uFEFF학번,이름,최종점수,제출일시\n";
      records.forEach(r => {
        csvContent += `"${r.studentId}","${r.studentName}",${r.score},"${r.date}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `지역화전략_퀴즈성적리포트_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function clearAllData() {
      if (confirm('모든 학생 성적 기록을 완전히 삭제하시겠습니까?')) {
        localStorage.removeItem('quiz_student_results');
        renderTable();
        alert('모든 데이터가 초기화되었습니다.');
      }
    }

    window.onload = renderTable;
  </script>
</body>
</html>
